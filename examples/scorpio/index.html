<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIP — Scorpio Review</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0b1020;color:#e9eefb}body{margin:0 auto;padding:24px;max-width:1100px}h1{font-size:1.6rem}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:18px}section{border:1px solid #35405f;border-radius:12px;padding:18px;background:#151d32}canvas{width:100%;height:auto;background:#080f24;border-radius:10px}label{display:block;margin:12px 0 6px}input,select,textarea,button{font:inherit;max-width:100%;color:inherit;background:#202b45;border:1px solid #526185;border-radius:6px;padding:7px}input[type=range]{width:95%}textarea{width:95%;min-height:70px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #9dc4ff}ul{padding-left:18px}small{color:#aab7da}#frames{display:flex;flex-wrap:wrap;gap:6px}#frames button[aria-current=true]{border-color:#9dc4ff;background:#40547b}@media(max-width:750px){main{grid-template-columns:1fr}}
</style></head><body>
<h1>MIP · Scorpio Motion Review</h1><p><small>Local proof-of-concept. Comments remain in this browser session; no creative lock or approval is issued.</small></p>
<main><section><canvas id="preview" width="720" height="405" aria-label="Scorpio scene preview"></canvas>
<label for="scenario">Scenario</label><select id="scenario"></select>
<label for="timeline">Timeline <output id="time">0 ms</output></label><input id="timeline" type="range" min="0" max="4500" step="10" value="0">
<button id="play" type="button">Play</button><button id="pause" type="button">Pause</button>
<h3>Storyboard keyframes</h3><div id="frames"></div></section>
<section><h2 id="caption">Await selection</h2><p id="state"></p><p id="transition"></p>
<label for="author">Reviewer identifier</label><input id="author" value="designer" autocomplete="off">
<label for="comment">Comment on this exact instant</label><textarea id="comment" placeholder="Describe what needs to change"></textarea>
<button id="add" type="button">Add review comment</button><h3>Comments</h3><ul id="comments"></ul></section></main>
<script type="module" src="./reviewer.mjs"></script></body></html>
