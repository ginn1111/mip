<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIP — Scorpio Review</title>
<style>
:root{font:15px Inter,system-ui,sans-serif;background:#faf9f5;color:#141413}*{box-sizing:border-box}body{margin:0 auto;padding:32px;max-width:1180px}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:2.2rem;margin-bottom:6px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:20px}section{border:1px solid #e6dfd8;border-radius:12px;padding:20px;background:#fff}canvas{width:100%;height:auto;background:#181715;border-radius:12px}label{display:block;margin:14px 0 6px;font-weight:600}input,select,textarea,button{font:inherit;max-width:100%;color:#141413;background:#faf9f5;border:1px solid #d5cec5;border-radius:8px;padding:10px}input[type=range],textarea{width:100%}textarea{min-height:74px}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #cc785c55;border-color:#cc785c}.primary{background:#cc785c;color:#fff;border-color:#cc785c;width:100%;margin-top:14px}.primary:disabled{background:#e6dfd8;color:#6c6a64;border-color:#e6dfd8;cursor:not-allowed}small,.muted{color:#6c6a64}.mono{font-family:ui-monospace,monospace;font-size:.82rem;overflow-wrap:anywhere}.controls{display:flex;gap:8px;align-items:center}.segments{list-style:none;padding:0}.segment{padding:12px 0;border-top:1px solid #ebe6df}.segment textarea{margin-top:8px}.status{padding:10px;border-radius:8px;background:#f5f0e8;margin-top:12px}.success{color:#285c35;background:#e7f4ea}.error{color:#8b2727;background:#f9e8e8}#frames{display:flex;flex-wrap:wrap;gap:6px}#frames button[aria-current=true]{border-color:#cc785c;background:#efe9de}@media(max-width:780px){body{padding:18px}main{grid-template-columns:1fr}}
</style></head><body>
<h1>MIP · Scorpio Motion Review</h1><p class="muted">Review every required segment. Approval locks exact prototype revision and SHA-256 digest.</p>
<main><section><canvas id="preview" width="720" height="405" aria-label="Scorpio scene preview"></canvas>
<label for="scenario">Scenario</label><select id="scenario"></select>
<label for="timeline">Timeline <output id="time">0 ms</output></label><input id="timeline" type="range" min="0" max="4500" step="10" value="0">
<div class="controls"><button id="play" type="button">Play</button><button id="pause" type="button">Pause</button></div>
<h3>Storyboard keyframes</h3><div id="frames"></div></section>
<section><h2 id="caption">Await selection</h2><p id="state"></p><p id="transition"></p>
<p><strong>Prototype</strong><br><span id="prototype-ref" class="mono">Loading…</span></p>
<label for="token">Host review token</label><input id="token" type="password" autocomplete="off" placeholder="Configured MIP_REVIEW_TOKEN">
<h3>Required segments</h3><ul id="segments" class="segments"></ul>
<button id="approve" class="primary" type="button" disabled>Approve and lock creative artifacts</button>
<p id="status" class="status" role="status">Load prototype evidence before approval.</p></section></main>
<script type="module" src="./reviewer.mjs"></script></body></html>
